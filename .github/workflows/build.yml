name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (tag v<version>) from this commit"
        type: boolean
        default: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests (with the live MusicBrainz / Cover Art Archive test)
        env:
          QT_QPA_PLATFORM: offscreen
          PR7L_LIVE: "1"
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}  # optional: without it the live Discogs test is skipped
        run: python -m pytest -q -rs
      - name: Build PR7-L.exe
        run: pyinstaller --noconfirm pr7l.spec
      - name: Check the build
        shell: pwsh
        run: |
          foreach ($f in "dist/PR7-L/PR7-L.exe", "dist/PR7-L/_internal/pr7l/fonts/Inter-Regular.ttf",
                         "dist/PR7-L/_internal/pr7l/icons/app.ico") {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }
          Copy-Item README.md, NOTICE.md dist/PR7-L/
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/PR7-L -DestinationPath "PR7-L-${{ github.ref_name }}-windows-x64.zip".Replace('/', '-')
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $v = (Select-String -Path pr7l/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DAppVersion=$v installer/pr7l.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          "PR7L_VERSION=$v" >> $env:GITHUB_ENV
      - name: Test the installer (silent install, check, uninstall, check)
        shell: pwsh
        run: |
          $p = Start-Process "dist/PR7-L-Setup-$env:PR7L_VERSION.exe" -Wait -PassThru `
               -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=install.log"
          if ($p.ExitCode -ne 0) { Get-Content install.log; throw "install failed: $($p.ExitCode)" }
          python tools/verify_install.py installed
          if ($LASTEXITCODE -ne 0) { Get-Content install.log; throw "install check failed" }
          $p = Start-Process "$env:LOCALAPPDATA\Programs\PR7-L\unins000.exe" -Wait -PassThru `
               -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          python tools/verify_install.py uninstalled
          if ($LASTEXITCODE -ne 0) { throw "uninstall check failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: PR7-L-Setup
          path: dist/PR7-L-Setup-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PR7-L-windows-x64
          path: PR7-L-*.zip
      - name: Release notes (this version's CHANGELOG section)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        shell: python
        run: |
          import os, re
          v = os.environ["PR7L_VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(v) + r"\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
          open("release-notes.md", "w", encoding="utf-8").write((m.group(1).strip() if m else "Paragon PR7-L " + v) + "\n")
      - name: Name the zip by version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        shell: pwsh
        run: Get-Item PR7-L-*.zip | Rename-Item -NewName "PR7-L-v$env:PR7L_VERSION-windows-x64.zip"
      - name: Release (tags v*, or Run workflow with "Publish a release" ticked)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.PR7L_VERSION) }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: |
            dist/PR7-L-Setup-*.exe
            PR7-L-v*-windows-x64.zip
          name: Paragon PR7-L v${{ env.PR7L_VERSION }}
